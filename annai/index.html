<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ナゴヤ案内所 | ナゴヤ人間</title>
<meta name="description" content="名古屋の批評メディア「ナゴヤ人間」の記事アーカイブから、出典付きで質問に答えるAI案内所。">
<style>
  :root{
    --bg:#070707; --ink:#f5f3ee; --dim:#8a8780;
    --yellow:#f0e040; --orange:#ffa800; --site:#DD5E2C; --green:#6effa0;
    --card:#111110; --line:#26251f;
    --sans:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;
    --mono:'SFMono-Regular',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}
  main{width:100%;max-width:720px;margin:0 auto;padding:28px 18px 120px;flex:1}

  .badge{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--green);border:1px solid var(--green);border-radius:999px;padding:3px 12px;letter-spacing:.08em}
  h1{font-size:34px;font-weight:900;margin:14px 0 6px}
  h1 .y{color:var(--yellow);text-shadow:0 0 40px rgba(240,224,64,.45)}
  .sub{color:var(--dim);font-size:13.5px;font-weight:600;line-height:1.7}
  .sub b{color:var(--yellow);font-weight:800}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
  .chip{font-size:12.5px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--yellow);color:var(--yellow)}

  #log{margin-top:18px;display:flex;flex-direction:column;gap:14px}
  .msg-q{align-self:flex-end;max-width:85%;background:var(--yellow);color:#080808;font-weight:700;font-size:14px;border-radius:14px 14px 3px 14px;padding:10px 14px;line-height:1.7}
  .msg-a{align-self:flex-start;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:3px 14px 14px 14px;padding:14px 16px;font-size:14.5px;line-height:2.0}
  .msg-a.refused{border-color:var(--orange)}
  .msg-a .prefix{font-family:var(--mono);color:var(--green);font-size:12px;display:block;margin-bottom:6px}
  .srcs{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
  .srcs .label{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em}
  .src{display:block;text-decoration:none;background:#0d0d0c;border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:.15s}
  .src:hover{border-color:var(--yellow)}
  .src .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:3px}
  .src .meta .paid{color:var(--orange)}
  .src .t{color:var(--ink);font-size:13px;font-weight:700;line-height:1.55}
  .thinking{font-family:var(--mono);color:var(--dim);font-size:13px;padding:6px 2px}

  #gate{display:none;background:var(--card);border:1px solid var(--orange);border-radius:14px;padding:18px;margin-top:16px;font-size:13.5px;line-height:1.9}
  #gate b{color:var(--yellow)}
  #gate a{color:var(--green)}
  #gate input{background:#0d0d0c;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:13px;width:150px}
  #gate button{background:var(--yellow);color:#080808;border:none;border-radius:8px;font-weight:800;padding:8px 14px;cursor:pointer;font-size:13px}

  form#ask{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#070707 30%);padding:26px 18px 20px;pointer-events:none}
  .askin{max-width:720px;margin:0 auto;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;pointer-events:auto}
  .askin:focus-within{border-color:var(--yellow)}
  .askin .p{font-family:var(--mono);color:var(--green);align-self:center;padding-left:8px;font-size:15px}
  #q{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;font-family:var(--sans);padding:8px 4px}
  #send{background:var(--yellow);color:#080808;border:none;border-radius:10px;font-weight:900;font-size:14px;padding:0 20px;cursor:pointer}
  #send:disabled{background:var(--line);color:var(--dim);cursor:default}
  .quota{max-width:720px;margin:7px auto 0;font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
  .quota .member{color:var(--green)}

  footer{border-top:1px solid var(--line);padding:20px 18px 0;color:var(--dim);font-size:11.5px;line-height:1.9}
  footer .inner{max-width:720px;margin:0 auto;padding-bottom:16px}
  footer a{color:var(--dim)}
  .band{height:8px;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--site))}
</style>
</head>
<body>
<main>
  <span class="badge">&gt; ナゴヤ人間ラボ 制作記録</span>
  <h1>ナゴヤ<span class="y">案内所</span></h1>
  <p class="sub">名古屋の批評メディア「ナゴヤ人間」の記事<b id="count">182</b>本だけを根拠に、出典付きで質問に答えます。記事にないことは、答えません。</p>

  <div class="chips" id="chips">
    <button class="chip">名駅の再開発は今どうなっていますか</button>
    <button class="chip">「名古屋には何もない」は本当ですか</button>
    <button class="chip">森道市場はどんなフェスですか</button>
    <button class="chip">河村市政の15年で何が変わりましたか</button>
    <button class="chip">アジア大会は何が問題になっていますか</button>
    <button class="chip">リニアが来ると名古屋はどう変わりますか</button>
  </div>

  <div id="log"></div>

  <div id="gate">
    本日の無料枠(<b>3問</b>)を使い切りました。<br>
    <a href="https://note.com/citypod_nagoya/membership" target="_blank" rel="noopener">ナゴヤ人間ラボ(月500円)</a>の会員は、会員限定記事に載っている合言葉で引き続き質問できます。<br><br>
    <input id="passcode" type="text" placeholder="合言葉" autocomplete="off">
    <button id="unlock">解錠する</button>
    <span id="gate-msg"></span>
  </div>
</main>

<form id="ask">
  <div class="askin">
    <span class="p">&gt;</span>
    <input id="q" type="text" maxlength="300" placeholder="名古屋について、聞きたいことをどうぞ" autocomplete="off">
    <button id="send" type="submit">聞く</button>
  </div>
  <div class="quota" id="quota"></div>
</form>

<footer>
  <div class="inner">
    回答はAIが記事アーカイブに基づいて生成しています。誤りを含む可能性があるため、重要な判断には出典記事と一次情報を確認してください。答えられなかった質問は、今後の取材テーマとして記録されます。<br>
    <a href="https://nagoya-ningen.github.io/" target="_blank" rel="noopener">ナゴヤ人間 公式サイト</a> ／
    <a href="https://note.com/citypod_nagoya" target="_blank" rel="noopener">note</a> ／
    <a href="https://note.com/citypod_nagoya/membership" target="_blank" rel="noopener">ナゴヤ人間ラボ(メンバーシップ)</a>
  </div>
</footer>
<div class="band"></div>

<script>
// ==== 設定 ====================================================
// 本番(GitHub Pages)ではWorkerのURLを指定する。ローカル開発では同一オリジン。
const API_BASE = location.hostname.endsWith("github.io")
  ? "https://nagoya-annai.REPLACE_ME.workers.dev"   // ← デプロイ後に自分のWorker URLへ
  : "";
const FREE_PER_DAY = 3;
// =============================================================

const $ = (s) => document.querySelector(s);
const log = $("#log"), qInput = $("#q"), sendBtn = $("#send");

function todayKey(){ return "annai_used_" + new Date().toISOString().slice(0,10); }
function usedToday(){ return parseInt(localStorage.getItem(todayKey()) || "0", 10); }
function passcode(){ return localStorage.getItem("annai_passcode") || ""; }
function isMember(){ return !!passcode(); }

function updateQuota(){
  const el = $("#quota");
  if (isMember()) { el.innerHTML = '<span class="member">会員モード</span>'; return; }
  const left = Math.max(0, FREE_PER_DAY - usedToday());
  el.textContent = `無料枠 のこり${left}問(1日${FREE_PER_DAY}問)`;
  if (left <= 0) { $("#gate").style.display = "block"; sendBtn.disabled = true; }
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function renderAnswer(data){
  const a = el("div", "msg-a" + (data.refused ? " refused" : ""));
  const p = el("span", "prefix", data.refused ? "> 記事なし(ネタ帳に記録)" : "> 記事から回答");
  a.appendChild(p);
  a.appendChild(el("div", "", data.answer));
  if (data.sources && data.sources.length){
    const s = el("div", "srcs");
    s.appendChild(el("div", "label", "出典"));
    for (const src of data.sources){
      const card = el("a", "src");
      card.href = src.url; card.target = "_blank"; card.rel = "noopener";
      const meta = el("div", "meta", `${src.date}　${src.tag}`);
      if (src.paid) meta.innerHTML += '　<span class="paid">有料記事</span>';
      card.appendChild(meta);
      card.appendChild(el("div", "t", src.title));
      s.appendChild(card);
    }
    a.appendChild(s);
  }
  log.appendChild(a);
}

let busy = false;
async function ask(question){
  if (busy || !question.trim()) return;
  if (!isMember() && usedToday() >= FREE_PER_DAY){ updateQuota(); return; }
  busy = true; sendBtn.disabled = true;
  log.appendChild(el("div", "msg-q", question));
  const th = el("div", "thinking", "> 記事アーカイブを検索中…");
  log.appendChild(th);
  th.scrollIntoView({behavior:"smooth", block:"end"});
  try {
    const res = await fetch(API_BASE + "/api/ask", {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify({question, passcode: passcode() || undefined}),
    });
    const data = await res.json();
    th.remove();
    if (!data.ok){
      const a = el("div", "msg-a refused");
      a.appendChild(el("span", "prefix", "> エラー"));
      a.appendChild(el("div", "", data.error || "エラーが発生しました。"));
      log.appendChild(a);
      if (res.status === 403){ localStorage.removeItem("annai_passcode"); }
    } else {
      renderAnswer(data);
      if (!isMember()) localStorage.setItem(todayKey(), String(usedToday() + 1));
    }
  } catch (e) {
    th.remove();
    const a = el("div", "msg-a refused");
    a.appendChild(el("span", "prefix", "> 接続エラー"));
    a.appendChild(el("div", "", "案内所に接続できませんでした。時間をおいて試してください。"));
    log.appendChild(a);
  }
  busy = false;
  updateQuota();
  if (isMember() || usedToday() < FREE_PER_DAY) sendBtn.disabled = false;
  log.lastElementChild.scrollIntoView({behavior:"smooth", block:"end"});
}

$("#ask").addEventListener("submit", (e) => { e.preventDefault(); const q = qInput.value; qInput.value = ""; ask(q); });
$("#chips").addEventListener("click", (e) => { if (e.target.classList.contains("chip")) ask(e.target.textContent); });
$("#unlock").addEventListener("click", (e) => {
  e.preventDefault();
  const v = $("#passcode").value.trim();
  if (!v) return;
  localStorage.setItem("annai_passcode", v);
  $("#gate").style.display = "none";
  $("#gate-msg").textContent = "";
  sendBtn.disabled = false;
  updateQuota();
});

fetch(API_BASE + "/api/health").then(r => r.json()).then(d => {
  if (d.articles) $("#count").textContent = d.articles;
}).catch(() => {});
updateQuota();
</script>
</body>
</html>
